[package]
name = "ble-ingester"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "macros", "chrono", "sqlite"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "chrono"] }
